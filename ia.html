 <p><button id="eAll" class="on">Toute la population (JSON)</button> <button id="eBest">Le meilleur actuel</button> <button id="eOld">La plus ancienne</button> <button id="eSave">Sauvegarde complète</button> <button id="eHtml" class="on">ia.html avec mes IA intégrées</button> <input type="file" id="eLoad" accept=".json"></p>`;
 $('eAll').onclick=()=>dl('nxai-population-S'+(arena.season+1)+'.json',arena.exportAll());$('eBest').onclick=()=>dl('nxai-meilleure.json',arena.exportAgent(rowsSorted()[0]));$('eOld').onclick=()=>dl('nxai-doyenne.json',arena.exportAgent(arena.agents.slice().sort((a,b)=>b.age-a.age)[0]));
 $('eHtml').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([embedHtml()],{type:'text/html'}));a.download='ia.html';a.click()};$('eSave').onclick=()=>dl('nxai-sauvegarde.json',JSON.parse(localStorage.getItem(KEY)||'{}'));
 $('eLoad').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(restore(o)){save();alert('Sauvegarde chargée.');render(true)}else alert('Format non reconnu (utilise « Sauvegarde complète »).')}catch(x){alert('Fichier illisible')}};r.readAsText(f)}}
function dl(n,o){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=n;a.click()}
let rendered={};function render(force){renderKpis();if(S.tab==='dash')renderDash();else if(S.tab==='ag')renderAgents();else if(S.tab==='hall')renderHall();else if(force){if(S.tab==='data')renderData();if(S.tab==='goal')renderGoal();if(S.tab==='exp')renderExp()}}
drawSpeed();showTab('dash');setInterval(()=>render(false),400);addEventListener('resize',()=>render(true));
window.__nxai={S,arena:()=>arena,startSeason,initWorkers};
